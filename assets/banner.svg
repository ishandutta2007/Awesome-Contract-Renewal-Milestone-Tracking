<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.15"/>
    </linearGradient>

    <!-- Glowing Orbs Gradients -->
    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowEmerald" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.3"/>
    </pattern>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 44px;
      fill: url(#primaryGrad);
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #e2e8f0;
      letter-spacing: 0.2px;
    }
    .tagline {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 14px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 12px;
      fill: #38bdf8;
      letter-spacing: 0.5px;
    }
    .pill-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #cbd5e1;
    }
    
    /* Subtle animations for dynamic backdrop */
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.4; transform: scale(1); }
      50% { opacity: 0.75; transform: scale(1.15); }
    }
    @keyframes floatDash {
      to { stroke-dashoffset: -40; }
    }
    @keyframes beaconGlow {
      0%, 100% { r: 5; opacity: 1; }
      50% { r: 9; opacity: 0.4; }
    }
    
    .anim-glow-1 {
      animation: pulseGlow 7s ease-in-out infinite;
      transform-origin: 200px 100px;
    }
    .anim-glow-2 {
      animation: pulseGlow 9s ease-in-out infinite 3s;
      transform-origin: 1000px 300px;
    }
    .flow-line {
      stroke-dasharray: 8 8;
      animation: floatDash 3s linear infinite;
    }
    .beacon {
      animation: beaconGlow 2.5s ease-in-out infinite;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bgGrad)"/>
  <rect width="1200" height="420" fill="url(#grid)"/>

  <!-- Dynamic Animated Glows (Kept strictly in background behind cards and text) -->
  <circle cx="200" cy="100" r="220" fill="url(#glowCyan)" class="anim-glow-1"/>
  <circle cx="1020" cy="300" r="250" fill="url(#glowPurple)" class="anim-glow-2"/>
  <circle cx="600" cy="380" r="180" fill="url(#glowEmerald)"/>

  <!-- Background Visual Flow: Milestone Tracker Timeline / Pipeline -->
  <g opacity="0.35">
    <path class="flow-line" d="M 80 340 L 400 340 L 600 300 L 820 300 L 1120 340" fill="none" stroke="#475569" stroke-width="2"/>
    <circle cx="240" cy="340" r="5" fill="#38bdf8"/>
    <circle cx="500" cy="320" r="5" fill="#818cf8"/>
    <circle cx="710" cy="300" r="5" fill="#a855f7"/>
    <circle cx="970" cy="320" r="5" fill="#34d399"/>
  </g>

  <!-- Content Group -->
  <g transform="translate(60, 45)">
    <!-- Category Pill Badge -->
    <rect x="0" y="0" width="280" height="32" rx="16" fill="url(#badgeGrad)" stroke="#0284c7" stroke-width="1.2"/>
    <circle cx="16" cy="16" r="4" fill="#38bdf8" class="beacon"/>
    <text x="30" y="21" class="badge-text">⚡ CURATED AWESOME ECOSYSTEM</text>

    <!-- Main Title -->
    <text x="0" y="85" class="title">Contract Renewal &amp; Milestone Tracking</text>

    <!-- Subtitle -->
    <text x="0" y="125" class="subtitle">Enterprise SaaS Platforms, Obligation Engines &amp; Open-Source CLM Repositories</text>

    <!-- Tagline -->
    <text x="0" y="155" class="tagline">Never miss notice windows, expiration cutoffs, price-increase freezes, or auto-renewal deadlines again.</text>

    <!-- Feature Cards & Pills -->
    <g transform="translate(0, 190)">
      <!-- Card 1 -->
      <g transform="translate(0, 0)">
        <rect width="250" height="72" rx="10" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1.2"/>
        <circle cx="34" cy="36" r="16" fill="#0284c7" fill-opacity="0.2"/>
        <text x="26" y="42" font-size="18">🔔</text>
        <text x="62" y="32" class="pill-text" fill="#f8fafc">Auto-Renewal Alerts</text>
        <text x="62" y="52" class="tagline" font-size="12">30/60/90-Day Notice Windows</text>
      </g>

      <!-- Card 2 -->
      <g transform="translate(270, 0)">
        <rect width="250" height="72" rx="10" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1.2"/>
        <circle cx="34" cy="36" r="16" fill="#6366f1" fill-opacity="0.2"/>
        <text x="26" y="42" font-size="18">📅</text>
        <text x="62" y="32" class="pill-text" fill="#f8fafc">Milestone Workflows</text>
        <text x="62" y="52" class="tagline" font-size="12">Deliverables &amp; Expirations</text>
      </g>

      <!-- Card 3 -->
      <g transform="translate(540, 0)">
        <rect width="250" height="72" rx="10" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1.2"/>
        <circle cx="34" cy="36" r="16" fill="#a855f7" fill-opacity="0.2"/>
        <text x="26" y="42" font-size="18">🤖</text>
        <text x="62" y="32" class="pill-text" fill="#f8fafc">AI Clause Extraction</text>
        <text x="62" y="52" class="tagline" font-size="12">Automated Date Intelligence</text>
      </g>

      <!-- Card 4 -->
      <g transform="translate(810, 0)">
        <rect width="270" height="72" rx="10" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1.2"/>
        <circle cx="34" cy="36" r="16" fill="#10b981" fill-opacity="0.2"/>
        <text x="26" y="42" font-size="18">🔓</text>
        <text x="62" y="32" class="pill-text" fill="#f8fafc">Self-Hosted &amp; Open-Source</text>
        <text x="62" y="52" class="tagline" font-size="12">Vendor-Neutral Date Engines</text>
      </g>
    </g>

    <!-- Bottom Metadata Row -->
    <g transform="translate(0, 290)">
      <rect width="1080" height="34" rx="8" fill="#1e293b" fill-opacity="0.5" stroke="#334155" stroke-width="0.8"/>
      <text x="20" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">
        📊 <tspan fill="#e2e8f0" font-weight="600">Enterprise Pricing Transparency</tspan> • 🆓 <tspan fill="#e2e8f0" font-weight="600">Free Tier &amp; Trial Limits</tspan> • ⭐ <tspan fill="#e2e8f0" font-weight="600">Live GitHub Star Badges</tspan> • 🌐 <tspan fill="#e2e8f0" font-weight="600">Market Dynamics</tspan>
      </text>
    </g>
  </g>
</svg>
